[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-attention-lab"
version = "2.0.0"
description = "FlashAttention 1-4 on B200: a CUDA/PTX kernel course"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.10.0", "ninja==1.13.0", "pytest==9.0.2", "apache-tvm-ffi==0.1.16"]

[project.scripts]
fa-lab = "labkit.cli:main"

[tool.setuptools.packages.find]
include = ["labkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: needs the selected B200 GPU"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["third_party", "artifacts", ".cache", "progress"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F"]
# Runtime setup precedes torch imports. The formatter handles line wrapping;
# mathematical variables such as l retain their meaning.
ignore = ["E402", "E501", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
