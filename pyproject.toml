[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-attention-lab"
version = "0.2.0"
description = "B200 kernel exercises; student kernels intentionally unimplemented"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.10.0", "ninja==1.13.0", "pytest==9.0.2", "apache-tvm-ffi==0.1.16"]

[project.scripts]
fa-lab = "flash_attention_lab.cli:main"

[tool.setuptools.packages.find]
include = ["flash_attention_lab*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests/infra"]
addopts = "-ra"
markers = ["gpu: requires the selected GPU", "student: explicit student acceptance, fails when unimplemented"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["third_party", "students", "artifacts", ".cache", "progress/results"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F"]
# Runtime setup precedes torch imports. The formatter handles line wrapping;
# mathematical variables such as l retain their meaning.
ignore = ["E402", "E501", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
